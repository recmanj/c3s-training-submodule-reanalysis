
name: Notebook QA

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      notebooks:
        description: "Space-separated list of notebook paths to check (default: all *.ipynb)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  notebook-qa:
    uses: recmanj/ecmwf-training-reusable-workflows/.github/workflows/notebook-qa.yml@qa-table-plumber-tests
    with:
      notebooks: ${{ inputs.notebooks || '' }}
      qa_tools_repo: recmanj/ecmwf-training-reusable-workflows
      qa_tools_ref: qa-table-plumber-tests
    secrets:
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}

